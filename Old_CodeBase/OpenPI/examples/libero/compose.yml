# Run with:
# docker compose -f examples/libero/compose.yml up --build
services:
  runtime:
    image: libero
    build:
      context: ../..
      dockerfile: examples/libero/Dockerfile
    init: true
    tty: true
    stdin_open: true
    network_mode: host
    privileged: true
    volumes:
      - $PWD:/app
      - ../../data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - CLIENT_ARGS
      - DISPLAY=$DISPLAY
      - MUJOCO_GL=${MUJOCO_GL:-egl}
      - OPENAI_API_KEY
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    
    network_mode: host 

    volumes:
      - ollama_data:/root/.ollama
      
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      
    restart: unless-stopped
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              
volumes:
  ollama_data:
  
